<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexa – About our website</title>
  <link rel="shortcut icon" href="assets/Nexa.png" type="image/x-icon" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0d1c3f;
      color: white;
      padding-bottom: 100px; 
      overflow-x: hidden;
      overflow-y: auto;
    }

    .taskbar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1100px;
      height: 60px;
      background: rgba(50, 0, 56, 0.377);
      backdrop-filter: blur(25px);
      border-radius: 30px;
      box-shadow: 0 8px 40px rgba(48, 0, 58, 0.7),
                  0 0 25px rgba(0, 80, 180, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 30px;
      z-index: 1000;
    }

    .logo-container {
      position: absolute;
      left: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-container img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 8px;
    }
    .logo-text {
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 4px;
      color: rgb(33, 0, 63);
    }
    .logo-text .fron {
      font-weight: 700;
      text-shadow: 0 0 6px #5300b3,
                   0 0 12px #5300b3,
                   0 0 18px #5300b3;
    }
    .logo-text .za {
      font-weight: 700;
      color: #8c00ff;
      text-shadow: 0 0 8px #00ffff,
                   0 0 14px #00dfff,
                   0 0 20px #00bfff;
    }

    .nav {
      display: flex;
      gap: 30px;
      font-weight: 600;
      position: relative;
      z-index: 1001;
    }
    .nav a {
      color: #a8c6ff;
      text-decoration: none;
      font-size: 1.1rem;
      padding: 8px 14px;
      border-radius: 15px;
      transition: background-color 0.3s ease,
                  color 0.3s ease;
      user-select: none;
    }
    .nav a:hover {
      background-color: rgba(85, 0, 155, 0.85);
      color: #1a0025;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(0, 150, 255, 0.85);
    }
    .nav a.active {
      background-color: rgba(140, 0, 255, 0.85);
      color: #020202;
      box-shadow: 0 0 22px rgba(140, 0, 255, 0.85);
    }

    .hamburger {
      display: none;
    }

    .mobile-nav {
      display: none;
    }

    .footer-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, #12002f 0%, #0d1c3f 100%);
      z-index: 0;
      animation: glow 6s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% {
        filter: brightness(1);
      }
      50% {
        filter: brightness(1.15);
      }
    }

    /* New fade + slide animation */
    @keyframes slideInFade {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* FULL footer content wrapper fills space above taskbar */
    .footer-content {
      position: relative;
      padding: 60px 30px 140px 30px; /* extra bottom padding for new button */
      max-width: 1100px;
      margin: 0 auto;
      min-height: calc(100vh - 100px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      z-index: 1;
      user-select: none;
      text-align: center;
    }

    .footer-content h1 {
      font-size: 3rem;
      margin: 0;
      font-weight: 900;
      text-shadow: 0 0 8px #8c00ff;
      color: #b2a2ff;
      animation: slideInFade 1s ease forwards;
    }

    .footer-content p {
      font-size: 1.3rem;
      max-width: 600px;
      margin: 0 auto;
      color: #d1c9ffcc;
      animation: slideInFade 1.2s ease forwards;
    }

    /* Contact links container */
    .contact-links {
      display: flex;
      gap: 40px;
      justify-content: center;
      flex-wrap: wrap;
      animation: slideInFade 1.4s ease forwards;
    }

    .contact-links a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #b2a2ff;
      font-weight: 700;
      font-size: 1.2rem;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 25px;
      background: rgba(140, 0, 255, 0.15);
      box-shadow: 0 0 15px #8c00ff66;
      transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
      user-select: text;
    }
    .contact-links a:hover {
      background-color: #8c00ff;
      color: #fff;
      box-shadow: 0 0 25px #8c00ffcc;
      cursor: pointer;
    }

    /* Privacy Policy button */
    .privacy-policy-btn {
      margin-top: 25px;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #8c00ff;
      background: rgba(140, 0, 255, 0.15);
      border: 2px solid #8c00ff;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 10px #8c00ff88;
      text-decoration: none;
      display: inline-block;
      animation: slideInFade 1.6s ease forwards;
      transition: background-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
      user-select: none;
    }
    .privacy-policy-btn:hover {
      background-color: #8c00ff;
      color: #fff;
      box-shadow: 0 0 30px #8c00ffcc;
      text-decoration: none;
    }

    /* Icons with inline SVG */
    .contact-icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    @media (max-width: 720px) {
      .taskbar {
        display: none !important;
      }
      .hamburger {
        display: block !important;
        position: fixed;
        top: 20px;
        right: 20px;
        width: 35px;
        height: 30px;
        z-index: 10000;
        cursor: pointer;
      }
      .hamburger span {
        display: block;
        width: 100%;
        height: 4px;
        margin: 6px 0;
        background: white;
        border-radius: 2px;
        transition: 0.3s;
      }
      .mobile-nav {
        display: none;
        position: fixed;
        top: 70px;
        right: 20px;
        background: rgba(0, 0, 0, 0.85);
        padding: 20px;
        border-radius: 10px;
        flex-direction: column;
        z-index: 9999;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.1);
        transition: all 0.3s ease-in-out;
      }
      .mobile-nav.show {
        display: flex !important;
      }
      .mobile-nav a {
        color: white;
        text-decoration: none;
        margin: 10px 0;
      }

      .footer-content h1 {
        font-size: 2.2rem;
      }
      .footer-content p {
        font-size: 1.1rem;
      }
      .contact-links a {
        font-size: 1rem;
        padding: 10px 16px;
        gap: 8px;
      }
      .contact-icon {
        width: 20px;
        height: 20px;
      }
      .privacy-policy-btn {
        font-size: 1rem;
        padding: 12px 28px;
      }
    }
  </style>
</head>

  <script>
    // Mobile nav toggle
    const hamburger = document.querySelector('.hamburger');
    const mobileNav = document.querySelector('.mobile-nav');

    hamburger.addEventListener('click', () => {
      mobileNav.classList.toggle('show');
      hamburger.classList.toggle('open');
    });

    // Keyboard accessible hamburger
    hamburger.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        hamburger.click();
      }
    });
  </script>
